<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagler Launcher [v1.2]</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #090c10;
            color: #c9d1d9;
            overflow-x: hidden;
        }
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        header {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid #30363d;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        header h2 {
            margin: 0;
            color: #58a6ff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
        }
        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(13, 17, 23, 0.7);
            border: 1px solid #58a6ff;
            color: #c9d1d9;
            padding: 7px 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background: rgba(88, 166, 255, 0.25);
            color: #fff;
        }
        .nav-btn.active {
            background: #58a6ff;
            color: #090c10;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(88, 166, 255, 0.8);
        }
        .container {
            max-width: 1050px;
            margin: 25px auto;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(6px);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            min-height: 60vh;
        }
        /* Fullscreen styles */
        .container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            max-width: none;
            margin: 0;
            padding: 40px;
            border-radius: 0;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <header>
        <h2>Ealger Launcher [v1.2]</h2>
        <nav id="nav-bar"></nav>
        <button id="fs-btn" class="nav-btn">⛶ Fullscreen</button>
    </header>

    <!-- Content is injected here dynamically without changing websites or reloading -->
    <div class="container" id="content-area">
        <p>Loading content...</p>
    </div>

    <script>
        // ==========================================
        // 1. YOUR 9 FILES LIST
        // ==========================================
        const pages = [
            { label: "PixelClient 1.8.8", file: "PixelClient 1.8.8 WASM (1).html" },
            { label: "PixelClient 1.12.2", file: "PixelClient 1.12.2 WASM.html" },
            { label: "Eaglercraft 1.14.4", file: "Eaglercraft 1.14.4 WASM.html" },
            { label: "Eaglercraft 1.15.2", file: "Eaglercraft 1.15.2 WASM.html" },
            { label: "Eaglercraft 1.16", file: "EaglercraftX_1.16_WASM-GC_Offline_Download.html" },
            { label: "Eaglercraft 1.20.6", file: "EaglercraftX 1.20.6 WASM.html" },
            { label: "Eaglercraft 1.12.11", file: "Eaglercraft_1.21.11_WASM.html" },
            { label: "Eaglercraft 26.2", file: "eaglercraft26-2.html" },
            { label: "Eaglercraft 26.3", file: "Eaglercraft 26.3.html" }
        ];

        const navBar = document.getElementById("nav-bar");
        const contentArea = document.getElementById("content-area");

        // Function to load file content via fetch
        async function loadPageContent(filename, btnElement) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error("File not found");
                const htmlText = await response.text();

                // Parse the fetched file to extract just its body or content
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");
                
                // Inject the inner content directly into our container
                contentArea.innerHTML = doc.body.innerHTML;

                // Update active button styling
                document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
                if (btnElement) btnElement.classList.add("active");
            } catch (err) {
                contentArea.innerHTML = `<h3>Error</h3><p>Could not load ${filename}. Make sure the file exists in your repository folder!</p>`;
            }
        }

        // Build navigation buttons automatically
        pages.forEach((page, index) => {
            const btn = document.createElement("button");
            btn.textContent = page.label;
            btn.className = "nav-btn";

            if (index === 0) {
                loadPageContent(page.file, btn); // Load first file by default
            }

            btn.addEventListener("click", () => {
                loadPageContent(page.file, btn);
            });

            navBar.appendChild(btn);
        });

        // Fullscreen Toggle Logic
        const fsBtn = document.getElementById("fs-btn");
        const container = document.querySelector(".container");

        fsBtn.addEventListener("click", () => {
            container.classList.toggle("fullscreen");
            const isFull = container.classList.contains("fullscreen");
            
            fsBtn.style.position = isFull ? "fixed" : "static";
            fsBtn.style.top = "15px";
            fsBtn.style.right = "20px";
            fsBtn.style.zIndex = "10000";
            fsBtn.textContent = isFull ? "✕ Exit Fullscreen" : "⛶ Fullscreen";
        });

        // ==========================================
        // 2. PARTICLE NETWORK ENGINE
        // ==========================================
        const canvas = document.getElementById("particle-canvas");
        const ctx = canvas.getContext("2d");

        let particles = [];
        const particleCount = 85;
        const maxDistance = 130;
        let mouse = { x: null, y: null, radius: 160 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        window.addEventListener("mousemove", (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener("mouseout", () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.size = 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = "#58a6ff";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        ctx.strokeStyle = `rgba(88, 166, 255, ${1 - dist / maxDistance})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }

                if (mouse.x !== null && mouse.y !== null) {
                    const dx = particles[i].x - mouse.x;
                    const dy = particles[i].y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < mouse.radius) {
                        ctx.strokeStyle = `rgba(121, 192, 255, ${1 - dist / mouse.radius})`;
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>

</body>
</html>
